[build]
  publish = "."

[build.processing]
  skip_processing = false
[build.processing.html]
  pretty_urls = true

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[redirects]]
  from = "/apply"
  to = "/#quote"
  status = 301

[[redirects]]
  from = "/loan-programs/va-loans-nevada.html"
  to = "/loan-programs/va-loans-nevada"
  status = 301
  force = true

[[redirects]]
  from = "/loan-programs/first-time-home-buyer-nevada.html"
  to = "/loan-programs/first-time-home-buyer-nevada"
  status = 301
  force = true

[[redirects]]
  from = "/locations/henderson-mortgage-lender.html"
  to = "/locations/henderson-mortgage-lender"
  status = 301
  force = true

[[redirects]]
  from = "/locations/las-vegas-mortgage-lender.html"
  to = "/locations/las-vegas-mortgage-lender"
  status = 301
  force = true

[[redirects]]
  from = "/locations/henderson"
  to = "/locations/henderson-mortgage-lender"
  status = 301
  force = true

[[redirects]]
  from = "/locations/las-vegas"
  to = "/locations/las-vegas-mortgage-lender"
  status = 301
  force = true
