[build]
  publish = "."

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[forms]

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[redirects]]
  from = "/apply"
  to = "/#quote"
  status = 301

[[redirects]]
  from = "/pre-approval"
  to = "/#quote"
  status = 301

[[redirects]]
  from = "/va-loans-las-vegas"
  to = "/loan-programs/va-loans-nevada"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Short city URLs that have no file (pretty-urls + :slug.html caused a loop to /locations/:slug).
[[redirects]]
