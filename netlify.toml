[build]
  publish = "."

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Netlify Forms (already set up in index.html)
[forms]
  # Optional: You can add form notifications here later

# Optional redirects (example)
[[redirects]]
  from = "/apply"
  to = "/#quote"
  status = 301

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/locations/:slug.html"
  to = "/locations/:slug"
  status = 301

[[redirects]]
  from = "/loan-programs/:slug.html"
  to = "/loan-programs/:slug"
  status = 301

[[redirects]]
  from = "/calculators/:slug.html"
  to = "/calculators/:slug"
  status = 301
